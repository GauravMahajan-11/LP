
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102,126,234,0.3);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5365cc;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #msg {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

      
    </style>
</head>

<body>

<div class="container">

    <h2>Create Account</h2>
    <p class="subtitle">Register as a student to get started</p>

    <form id="form">

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="name"
                   placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password"
                   placeholder="Create a password"
                   minlength="6" required>
        </div>

        <button type="submit" id="btn">Register Now</button>

    </form>

    <p id="msg"></p>

</div>

<script>

document.getElementById("form").onsubmit = async function(e) {

    e.preventDefault();

    let user = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
    };

    let btn = document.getElementById("btn");
    let msg = document.getElementById("msg");

    btn.disabled = true;
    btn.innerText = "Registering...";
    msg.innerText = "";

    try {

        let res = await fetch("/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(user)
        });

        let data = await res.json();

        msg.innerText = data.message;
        msg.className = res.ok ? "success" : "error";

        if (res.ok) {
            document.getElementById("form").reset();
        }

    } catch (error) {

        msg.innerText = "Server connection failed!";
        msg.className = "error";

    }

    btn.disabled = false;
    btn.innerText = "Register Now";

};

</script>

</body>
</html>
